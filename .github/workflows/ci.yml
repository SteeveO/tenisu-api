name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The branch protection on main requires this job by name: do not rename it.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      dynamodb-local:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check Terraform
        run: |
          terraform fmt -check -recursive infra
          for stack in infra infra/bootstrap; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Wait for DynamoDB Local
        run: timeout 30 bash -c 'until curl --silent --output /dev/null http://localhost:8000; do sleep 1; done'

      - name: Integration tests
        run: npm run test:integration

  # Fork pull requests get no OIDC token: they skip this job.
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::112232724712:role/tenisu-github-plan
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      # -lock=false: this role only reads the state.
      - name: Plan
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock=false -concise > plan.txt

      - name: Comment the plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 infra/plan.txt
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last --create-if-none

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deployment at a time, and never cancelled halfway through an apply.
    concurrency: deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::112232724712:role/tenisu-github-deploy
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Deploy
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
